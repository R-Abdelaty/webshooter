<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Web Shooter</title>
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="backdrop"></div><div id="shade"></div>
  <main id="menu">
    <div class="menu-cover">
      <div class="title-block">
        <h1><span>WEB</span><span>SHOOTER</span></h1>
        <p>Hit every weak spot before the villain reaches you!</p>
      </div>
      <div class="menu-actions">
        <button id="btn-new" type="button"><span>START</span><span aria-hidden="true">→</span></button>
        <button id="btn-continue" type="button" disabled><span>CONTINUE</span><span aria-hidden="true">→</span></button>
        <button id="btn-settings" type="button"><span>SETTINGS</span><span aria-hidden="true">→</span></button>
      </div>
      <p id="menu-status" class="status">CONTROLLER: DISCONNECTED</p>
    </div>
    <div class="menu-stamp" aria-hidden="true">AIM.<br>FLICK.<br>FIRE!</div>
  </main>
  <section id="game" class="is-hidden">
    <header class="hud">
      <span id="hud-level">ENCOUNTER 1</span>
      <strong id="hud-vname"></strong>
      <span id="hud-health"></span>
      <div class="health"><i id="hud-healthbar"></i></div>
    </header>
    <canvas id="stage"></canvas>
    <footer class="hud-bottom">Move to aim · Click / Space to shoot · Esc to pause</footer>
    <div id="card" class="card-wrap is-hidden"><div class="card" id="card-inner"></div></div>
  </section>
  <div id="settings" class="panel-wrap is-hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="panel">
    <div class="panel-heading"><h2 id="settings-title">SETTINGS</h2><button id="btn-close" class="panel-close" type="button" aria-label="Close settings">×</button></div>
    <div class="panel-body">
      <h3>SOUND</h3>
      <label>MUSIC <input id="vol-music" type="range" min="0" max="100"></label>
      <label>EFFECTS <input id="vol-sfx" type="range" min="0" max="100"></label>
      <label><input id="chk-mute" type="checkbox"> MUTE</label>
      <h3>CONTROLLER</h3><p id="controller-status" class="controller-status">Controller disconnected</p>
      <label>INPUT <select id="input-source"><option value="mouse">Mouse</option><option value="wrist">Wrist</option></select></label>
      <label>SENSITIVITY <input id="sensitivity" type="range" min=".2" max="3" step=".1"></label>
      <label>HORIZONTAL <select id="horizontal-axis"><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select></label>
      <label>VERTICAL <select id="vertical-axis"><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select></label>
      <label><input id="invert-horizontal" type="checkbox"> INVERT HORIZONTAL</label>
      <label><input id="invert-vertical" type="checkbox"> INVERT VERTICAL</label>
      <div class="aim-tools"><button id="btn-center" type="button">CENTER AIM</button><div id="reticle-preview" aria-label="Reticle preview">+</div></div>
    </div>
  </div></div>
  <script src="js/audio.js"></script>
  <script src="js/villains.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/controller.js"></script>
  <script src="js/shooter-link.js"></script>
  <script src="js/game.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
